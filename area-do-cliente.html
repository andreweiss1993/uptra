<style>
:root{color-scheme:dark;--bg:#0E141B;--sf:#151D27;--ln:#243040;--fg:#E6EDF3;--mu:#8B9BAD;--ac:#38A9FF;--acs:#12304a;--ok:#3DDC84;--wa:#F5A524;--cr:#FF5C5C;--crs:#3a1f24;--bar:#3A4A5E;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:var(--sf);border-right:1px solid var(--ln);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
nav.side svg{height:36px;width:auto;margin:0 0 6px 6px}.plant{font-size:12px;color:var(--mu);padding:0 10px 14px}
nav.side a{padding:8px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-weight:500}nav.side a:hover{background:var(--bg)}nav.side a.on{background:var(--acs);color:var(--ac)}
nav.side a.out{color:var(--mu);margin-top:auto;font-size:13px}.demo{font-size:11px;color:var(--mu);padding:10px;border:1px dashed var(--ln);border-radius:6px;margin-top:8px}
main{padding:24px;min-width:0;max-width:1180px}.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:18px}
h1{font-size:24px;margin:0;letter-spacing:-.02em}.sub{color:var(--mu);margin:2px 0 0}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,input,button{font:inherit;color:var(--fg)}
select,input{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:6px 8px}input{width:96px}
button{cursor:pointer;border:1px solid var(--ln);background:var(--sf);border-radius:6px;padding:6px 12px;font-weight:500}button:disabled{opacity:.5;cursor:not-allowed}button.p{background:var(--ac);border-color:var(--ac);color:#04121F}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:6px;overflow:hidden}.seg button{border:0;border-radius:0;padding:4px 10px;font-size:12px}.seg button.on{background:var(--ac);color:#04121F}
.kpis{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;background:var(--sf);border:1px solid var(--ln);border-radius:8px;margin-bottom:16px}
.kpi{padding:16px 18px;border-left:1px solid var(--ln)}.kpi:first-child{border:0}.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.val{font-family:var(--mono);font-size:24px;font-weight:500;margin-top:4px}.kpi:first-child .val{font-size:30px;color:var(--ac)}.dl{font-family:var(--mono);font-size:12px;margin-top:2px;color:var(--mu)}.bad{color:var(--cr)}.good{color:var(--ok)}

 if(cmpUi.filter==='all'||cmpUi.filter==='missing')items.push(...c.aus.map(e=>({type:'missing',e,k:cmpKey(e,c.mode)})));
 const q=cmpUi.query.trim().toLocaleLowerCase('pt-BR');
 if(q)items=items.filter(x=>{const text=[x.e&&fmtRec(x.e),x.n&&fmtRec(x.n),...(x.ch||[]).flat()].join(' ').toLocaleLowerCase('pt-BR');return text.includes(q)});
 const pageSize=40,maxPage=Math.max(0,Math.ceil(items.length/pageSize)-1);cmpUi.page=Math.min(cmpUi.page,maxPage);const pageItems=items.slice(cmpUi.page*pageSize,(cmpUi.page+1)*pageSize);
 const renderRow=x=>{
  const before=x.e?fmtRec(x.e):'—',after=x.n?fmtRec(x.n):'—',id=(x.n||x.e||{}).os||'Sem ID',date=((x.n||x.e||{}).date||'').split('-').reverse().join('/');
  if(x.type==='changed')return x.ch.map(([field,oldv,newv])=>`<tr><td class="status"><span class="status-tag changed">Alterado</span></td><td class="mn">${esc(id)}<br><small>${esc(date)}</small></td><td>${esc(field)}</td><td class="old">${esc(oldv||'—')}</td><td class="new">${esc(newv||'—')}</td></tr>`).join('');
  const field=x.type==='added'?'Registro novo':x.type==='missing'?'Não veio no arquivo':'Sem diferença';
  return `<tr><td class="status"><span class="status-tag ${x.type}">${typeName[x.type]}</span></td><td class="mn">${esc(id)}<br><small>${esc(date)}</small></td><td>${field}</td><td>${esc(before)}</td><td>${esc(after)}</td></tr>`
 };
 const filterButtons=[['all',`Todos (${totals.all})`],['changed',`Alterados (${totals.changed})`],['added',`Novos (${totals.added})`],['missing',`Ausentes (${totals.missing})`],['same',`Iguais (${totals.same})`]];
 const danger=totals.missing>Math.max(50,totals.all*.2);
 V.innerHTML=`<div class="head"><div><h1>Modo compare</h1><p class="sub">${esc(META.nome||'Dados atuais')} · ${esc(S.name)} comparado aos dados salvos</p></div><div class="flt"><button id="backimport">Voltar à importação</button><button class="p" id="confirmimport">Revisar e confirmar importação</button></div></div>
 <section class="panel"><h2>Visão geral da comparação</h2><p class="hint">Versão atual: <b>${esc(META.nome||'Dados atuais')}</b> (${fmt(SAVED?SAVED.recs.length:0)} registros) · arquivo novo: <b>${esc(S.name)}</b> (${fmt(candidate.length)} registros).</p>
 <div class="compare-tools"><label class="hint" style="margin:0">Como identificar o mesmo registro:</label><select id="cmpmode" aria-label="Chave para comparar">${modes.map(([v,l])=>`<option value="${v}" ${v===c.mode?'selected':''}>${l}</option>`).join('')}</select><span class="hint" style="margin:0">Chave ativa: ${esc(modeName)}.</span></div>
 ${danger?`<div class="compare-alert"><b>Atenção: ${fmt(totals.missing)} registros aparecem como ausentes.</b> Isso pode ser uma exportação parcial, um mapeamento incorreto ou uma chave de comparação inadequada. Não marque remoção antes de conferir.</div>`:''}
 <div class="compare-kpis"><div class="compare-stat"><b>${fmt(candidate.length)}</b><span>no arquivo novo</span></div><div class="compare-stat"><b>${fmt(totals.same)}</b><span>iguais</span></div><div class="compare-stat"><b>${fmt(totals.changed)}</b><span>com diferenças</span></div><div class="compare-stat"><b>${fmt(totals.added)}</b><span>novos</span></div><div class="compare-stat"><b>${fmt(totals.missing)}</b><span>ausentes no arquivo</span></div></div>
 <p class="hint">A comparação é somente para revisão. Os dados atuais permanecem intactos até você confirmar a importação. Ausentes só serão removidos se você marcar essa opção na tela de confirmação.</p></section>
 <section class="panel" style="margin-top:16px"><h2>Registros e diferenças</h2><div class="compare-tools"><div class="compare-tabs">${filterButtons.map(([f,l])=>`<button data-cfilter="${f}" class="${cmpUi.filter===f?'active':''}">${l}</button>`).join('')}</div><input id="cmpsearch" type="search" placeholder="Buscar ID, máquina, data ou descrição" value="${esc(cmpUi.query)}" aria-label="Buscar na comparação"></div>
 <div class="sc"><table class="ls diff-table"><thead><tr><th>Status</th><th>Identificação</th><th>Campo</th><th>Versão atual</th><th>Arquivo novo</th></tr></thead><tbody>${pageItems.map(renderRow).join('')||`<tr><td colspan="5" class="empty">Nenhum registro neste filtro.</td></tr>`}</tbody></table></div>
 <div class="pager"><span>${items.length?`Mostrando ${cmpUi.page*pageSize+1}–${Math.min((cmpUi.page+1)*pageSize,items.length)} de ${fmt(items.length)} registros`: 'Nenhum resultado'}</span><div class="flt"><button id="prevpage" ${cmpUi.page===0?'disabled':''}>Anterior</button><button id="nextpage" ${cmpUi.page>=maxPage?'disabled':''}>Próxima</button></div></div>
 <div class="note">Dica: se muitos registros ficarem como ausentes ou novos, confira a chave selecionada, o mapeamento do identificador, a data e a unidade da duração antes de confirmar.</div></section>`;
 document.getElementById('backimport').onclick=()=>location.hash='importar';document.getElementById('confirmimport').onclick=()=>location.hash='importar';
 document.getElementById('cmpmode').onchange=e=>{S.res.cmp=compare(S.res.recs,SAVED?SAVED.recs:[],e.target.value);cmpUi.page=0;comparar()};
 V.querySelectorAll('[data-cfilter]').forEach(b=>b.onclick=()=>{cmpUi.filter=b.dataset.cfilter;cmpUi.page=0;comparar()});
 document.getElementById('cmpsearch').oninput=e=>{cmpUi.query=e.target.value;cmpUi.page=0;comparar();const i=document.getElementById('cmpsearch');i.focus();i.setSelectionRange(i.value.length,i.value.length)};
 document.getElementById('prevpage').onclick=()=>{cmpUi.page--;comparar()};document.getElementById('nextpage').onclick=()=>{cmpUi.page++;comparar()};
}

const VW={resumo,ativo,importar,comparar};
function route(){const v=VW[location.hash.slice(1)]?location.hash.slice(1):'resumo';document.querySelectorAll('nav.side a[data-v]').forEach(a=>a.classList.toggle('on',a.dataset.v===v));VW[v]();scrollTo(0,0)}
(async()=>{try{SAVED=(await idb('get'))||null}catch(e){}if(SAVED&&Array.isArray(SAVED.recs))setData(buildD(SAVED.recs),SAVED.meta||{nome:'seus dados',log:[]});else setData(DEMO,{demo:true,nome:'Dados de exemplo'});addEventListener('hashchange',route);route()})();
</script></body></html>
